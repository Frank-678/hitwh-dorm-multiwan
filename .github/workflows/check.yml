name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate scripts and project files
        run: make check
      - name: Build offline OpenWrt IPK
        run: make ipk
      - name: Check Git history and release payload for credential artifacts
        run: python3 tests/check_secrets.py --history --ipk dist/*.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10-ipk
          path: dist/

  dashboard:
    name: Dashboard (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test dashboard and SSH script transport
        run: python -m unittest discover -s dashboard/tests -v
      - name: Check macOS and Linux launcher
        if: runner.os != 'Windows'
        run: ./dashboard/start.command --help
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        run: |
          .\dashboard\start.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
