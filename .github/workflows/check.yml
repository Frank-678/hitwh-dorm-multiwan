name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    name: Dashboard browser interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser test runtime outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/hitwh-ui" --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: |
          "$RUNNER_TEMP/hitwh-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test clicks, focus, target scope and feedback during polling
        run: NODE_PATH="$RUNNER_TEMP/hitwh-ui/node_modules" node --test dashboard/tests/test_ui.cjs

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate scripts and project files
        run: make check
      - name: Build offline OpenWrt IPK
        run: make ipk
      - name: Check Git history and release payload for credential artifacts
        run: python3 tests/check_secrets.py --history --ipk dist/*.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10-ipk
          path: dist/

  dashboard:
    name: Dashboard (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test dashboard and SSH script transport
        run: python -m unittest discover -s dashboard/tests -v
      - name: Check macOS and Linux launcher
        if: runner.os != 'Windows'
        run: ./dashboard/start.command --help
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        run: |
          .\dashboard\start.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
